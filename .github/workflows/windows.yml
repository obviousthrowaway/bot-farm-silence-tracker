name: Windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    # A uv-managed CPython 3.12 (with Tk), like the standalone binaries.
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --extra gui
      # Windows runners have a display, so the desktop app's window tests must run.
      - run: uv run pytest -q
        env:
          BOT_FARM_SILENCE_TRACKER_REQUIRE_DISPLAY: "1"
