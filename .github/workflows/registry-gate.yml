name: Registry gate

# The required check for every pull request (see "Checks on registry pull requests" in
# docs/USAGE.md). It runs on pull_request_target, so this file and the code it runs come
# from the base branch, never from the pull request:
#
# - Only the base commit is checked out (into trusted/). The pull request's head is
#   fetched as git objects and read with git ls-tree and git cat-file; its files are
#   never checked out, installed or run.
# - The token is read-only (contents: read), no secret is used, credentials are not
#   persisted, and the uv cache is off, so nothing is shared with other runs.
# - There is no path filter: the job always runs, so it is a required check in the
#   main branch's ruleset (.github/rulesets/main.json). A code-only pull request
#   passes at once ("No registry data changed"): the "Classify the change" step skips
#   every later step.
# - It fails a pull request whose base is not the default branch: another branch's
#   copy of this file and of the gate code may be outdated or changed. The "edited"
#   event reruns it when the base branch of a pull request is changed.
# - The registry-override label requests an override for one head commit, and the
#   gate honours it only with two proofs. First, that the label was added while this
#   commit was the head: on the labeled event that added it, the event itself; on
#   later events, the registry-override/pr-<number> status that the Registry override
#   workflow (registry-override.yml) writes when the label is added. After a new push
#   the gate ignores the label, and that workflow removes it. That workflow has no
#   concurrency group, so the cancellation below never stops it. Second, an APPROVED
#   review whose commit is this head, by someone with admin access (the repository
#   owner) who is not the author; write or maintain access is not enough: the label names the head at the moment it was added, while
#   the review names the commit the maintainer actually reviewed.
# - The gate job only reads statuses, reviews and permissions (statuses: read,
#   pull-requests: read), in a step that runs no pull request code. It does not run on
#   pull_request_review: that event runs the pull request's own copy of a workflow.
#   After approving a head that already has the label, a maintainer reruns the gate.
#
# The gate takes effect from the first pull request opened after this file is on the
# base branch: pull_request_target always runs the base branch's version.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: registry-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    steps:
      - name: Require the default branch as the base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Pull requests must target the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      # Objects only: no checkout. The read-only token authenticates this one fetch
      # (the repository may be private) and is not stored.
      - name: Fetch the pull request head as git objects
        working-directory: trusted
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git cat-file -e "${HEAD_SHA}^{commit}"
      # The fast path for code-only pull requests. The same rule as the gate's own
      # (registry/ and events.toml are registry data): with no data path changed, the
      # job puts "No registry data changed" in its summary and succeeds without
      # installing or running anything else. Any data path, alone or with other
      # files, runs the full gate, which fails a mixed pull request. Only git objects
      # are read; a git error fails the job.
      - name: Classify the change
        id: classify
        working-directory: trusted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --name-only -z --no-renames "$merge_base" "$HEAD_SHA" -- > "$RUNNER_TEMP/changed-files"
          if grep -qzE '^(registry/|events\.toml$)' "$RUNNER_TEMP/changed-files"; then
            echo "data=true" >> "$GITHUB_OUTPUT"
          else
            echo "data=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Registry gate"
              echo
              echo "**PASS.** No registry data changed. The CI workflow checks code changes, and the repository owner reviews them (CODEOWNERS)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The proofs for the registry-override label (see the notes at the top), read
      # only when the label is present: the head commit's statuses, the reviews, and
      # the permissions of the people who approved the head. A failed API call for the
      # statuses or reviews fails the gate; a reviewer whose permission cannot be read
      # is left out, so their review approves nothing. When the label needs the status
      # and it is missing, the read is retried twice, 10 seconds apart, because a newer
      # event may have cancelled the labeled run before the Registry override workflow
      # wrote the status. If the gate still fails, rerun it.
      - name: Read the override proofs
        if: steps.classify.outputs.data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          statuses="$RUNNER_TEMP/override-statuses.jsonl"
          reviews="$RUNNER_TEMP/override-reviews.jsonl"
          permissions="$RUNNER_TEMP/reviewer-permissions.jsonl"
          : > "$statuses"
          : > "$reviews"
          : > "$permissions"
          has_label="$(jq -r '[.pull_request.labels[]?.name] | index("registry-override") != null' "$GITHUB_EVENT_PATH")"
          if [ "$has_label" != true ]; then
            exit 0
          fi
          needs_status="$(jq -r '.action != "synchronize" and (.action != "labeled" or .label.name != "registry-override")' "$GITHUB_EVENT_PATH")"
          context="registry-override/pr-${PR_NUMBER}"
          for attempt in 1 2 3; do
            gh api --paginate "repos/${REPOSITORY}/commits/${HEAD_SHA}/statuses?per_page=100" \
              --jq '.[] | {context, state, creator: .creator.login}' > "$statuses"
            if [ "$needs_status" != true ] || jq -e --arg context "$context" \
                'select(.context == $context)' "$statuses" > /dev/null; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "No $context status on the head yet; reading again in 10 seconds."
              sleep 10
            fi
          done
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            --jq '.[] | {id, user: .user.login, state, commit_id}' > "$reviews"
          jq -r --arg head "$HEAD_SHA" \
            'select(.state == "APPROVED" and .commit_id == $head) | .user // empty' "$reviews" |
            sort -u |
            while IFS= read -r user; do
              case "$user" in
                "" | *[!A-Za-z0-9-]*) continue ;;
              esac
              if permission="$(gh api "repos/${REPOSITORY}/collaborators/${user}/permission" --jq .permission)"; then
                jq -cn --arg user "$user" --arg permission "$permission" \
                  '{user: $user, permission: $permission}' >> "$permissions"
              fi
            done
      - if: steps.classify.outputs.data == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - if: steps.classify.outputs.data == 'true'
        run: uv sync --locked
        working-directory: trusted
      # Validates a data-only change (registry/ and events.toml), applies the policy
      # (changing an existing outage event's name, cutoff or windows, renaming or
      # deleting one, removals, any record moving into or changing while in
      # verified_inauthentic or cleared, large changes, records on uncheckable
      # platforms and any evidence change need the registry-override label and the
      # owner's approval; adding an event or plain scanned records does not) and
      # spot-checks the changed records against the live sources, each with its
      # event's cutoff, at 0.5 requests per second, at most 200 requests and 15 minutes.
      - name: Run the gate
        if: steps.classify.outputs.data == 'true'
        working-directory: trusted
        run: >-
          .venv/bin/bot-farm-silence-tracker registry gate --repo .
          --event "$GITHUB_EVENT_PATH"
          --override-statuses "$RUNNER_TEMP/override-statuses.jsonl"
          --override-reviews "$RUNNER_TEMP/override-reviews.jsonl"
          --reviewer-permissions "$RUNNER_TEMP/reviewer-permissions.jsonl"
          --summary "$GITHUB_STEP_SUMMARY"
