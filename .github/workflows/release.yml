name: Release

# Runs when a version tag such as v0.1.0 is pushed. Builds the wheel, the sdist and
# standalone executables for Windows, macOS and Linux, records build provenance
# attestations for them (only when the repository is public), and attaches them to a GitHub Release together with
# SHA256SUMS.txt (which install.sh and install.ps1 verify).
#
# Desktop app files (the contract the native installers build on):
#   bot-farm-silence-tracker-macos-arm64.app.zip and bot-farm-silence-tracker-macos-x64.app.zip
#     The PyInstaller app bundle "Bot Farm Silence Tracker.app" (windowed), zipped with
#     `ditto -c -k --keepParent`. Its executable, Contents/MacOS/Bot Farm Silence Tracker,
#     opens the desktop app.
#   bot-farm-silence-tracker-gui-windows-x64.exe
#     A single-file GUI-subsystem executable (no console window) that opens the desktop
#     app. Installers may install it as bot-farm-silence-tracker-gui.exe.
#   All three accept --selftest (build the window hidden, render every screen with
#   offline sample data, exit 0). The command-line binaries stay separate and also
#   open the app with `bot-farm-silence-tracker gui`. Every file is listed in
#   SHA256SUMS.txt and has a build provenance attestation.
#
# "Run workflow" (workflow_dispatch) is a dry run: it builds and tests everything and
# keeps the files as workflow artifacts, but publishes nothing and attests nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Tag must match the package version
        if: github.event_name == 'push'
        run: |
          version="$(uv run python -c 'import bot_farm_silence_tracker; print(bot_farm_silence_tracker.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  binary:
    name: binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bot-farm-silence-tracker-windows-x64
            ext: .exe
          - os: macos-14 # Apple silicon
            asset: bot-farm-silence-tracker-macos-arm64
            ext: ""
          # Intel Macs. macos-13 has been retired; GitHub plans to retire macos-15-intel,
          # its last Intel image, around August 2027. Drop this entry (and the
          # macos-x64 row in docs/USAGE.md) then; install.sh falls back to uv for Intel Macs.
          - os: macos-15-intel
            asset: bot-farm-silence-tracker-macos-x64
            ext: ""
          - os: ubuntu-22.04 # older glibc, so the binary runs on more distributions
            asset: bot-farm-silence-tracker-linux-x64
            ext: ""
          - os: ubuntu-22.04-arm
            asset: bot-farm-silence-tracker-linux-arm64
            ext: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build
        shell: bash
        run: ./packaging/build_binary.sh "${{ matrix.asset }}"
      - name: Smoke test
        shell: bash
        run: ./packaging/smoke_test.sh "./dist-bin/${{ matrix.asset }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}${{ matrix.ext }}

  # The desktop app (see the contract at the top of this file).
  gui:
    name: gui (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon
            asset: bot-farm-silence-tracker-macos-arm64.app.zip
          # Intel Macs; retire with the macos-x64 command-line binary (see above).
          - os: macos-15-intel
            asset: bot-farm-silence-tracker-macos-x64.app.zip
          - os: windows-latest
            asset: bot-farm-silence-tracker-gui-windows-x64.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build
        run: ./packaging/build_gui.sh bot-farm-silence-tracker-gui-windows-x64
      - name: Self-test and package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p release-gui
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="dist-bin/Bot Farm Silence Tracker.app"
            "$app/Contents/MacOS/Bot Farm Silence Tracker" --selftest
            ditto -c -k --keepParent "$app" "release-gui/$ASSET"
          else
            ./dist-bin/bot-farm-silence-tracker-gui-windows-x64.exe --selftest
            cp dist-bin/bot-farm-silence-tracker-gui-windows-x64.exe "release-gui/$ASSET"
          fi
          ls -l release-gui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: release-gui/${{ matrix.asset }}

  # The Linux binaries are built on Ubuntu 22.04 (glibc 2.35). Check that they still run
  # on older distributions: Rocky Linux 8 (glibc 2.28) and Debian 11 (glibc 2.31).
  glibc-compat:
    name: glibc-compat (${{ matrix.asset }}, ${{ matrix.image }})
    needs: [binary]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:8", "debian:bullseye"]
        asset: [bot-farm-silence-tracker-linux-x64, bot-farm-silence-tracker-linux-arm64]
        include:
          - asset: bot-farm-silence-tracker-linux-x64
            os: ubuntu-latest
          - asset: bot-farm-silence-tracker-linux-arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}
          path: bin
      - name: Smoke test in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          ASSET: ${{ matrix.asset }}
        run: |
          chmod +x "bin/$ASSET"
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" sh -c \
            'ldd --version | head -n 1 && ./packaging/smoke_test.sh "bin/$0"' "$ASSET"

  # The double-click installers (macOS .pkg, Windows Setup.exe), built from the programs
  # above and test-installed. See installers.yml. In release mode it downloads the desktop
  # app files from the "gui" job (hence "gui" in "needs") and fails when they are missing,
  # so a release never ships a stand-in.
  installers:
    needs: [binary, gui]
    uses: ./.github/workflows/installers.yml
    with:
      release: true

  checksums:
    needs: [dist, binary, glibc-compat, gui, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: artifacts/*

  # Only a pushed tag publishes. This is the only job with write permissions.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: artifacts
      # Attestations need a public repository (or GitHub Enterprise Cloud for a private
      # one), so the step is skipped while the repository is private. The release is
      # still published, with SHA256SUMS.txt; the installers warn that no attestation
      # exists and carry on after checking the checksum.
      - name: Record build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/bot-farm-silence-tracker-*
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
      # The release is created as a draft, so nobody (and no installer, which follows
      # /releases/latest) sees it until every file and SHA256SUMS.txt are attached. Then
      # it is published. Safe to rerun: a draft left by an earlier, partly failed run is
      # reused and its files are replaced; a release that is already published is left
      # alone, so its files are never briefly missing.
      - name: Create the GitHub Release as a draft, attach the files, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null)"; then
            # The notes come from the matching CHANGELOG.md section, never from
            # auto-generated notes, which list contributor mentions. A missing section
            # fails the step, so the release is not created.
            python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
            is_draft=true
          fi
          if [ "$is_draft" != "true" ]; then
            echo "Release $GITHUB_REF_NAME is already published; leaving it as it is."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Publishing to PyPI is intentionally not enabled. When the maintainer decides to
  # publish, add a job here that downloads the "dist" artifact and uses
  # pypa/gh-action-pypi-publish (pinned by commit SHA) with trusted publishing
  # (id-token: write).
