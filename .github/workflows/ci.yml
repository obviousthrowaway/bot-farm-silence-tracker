name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA; Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # The old owner placeholder was a bare word that is also a real GitHub
      # organization's name, so a link or attestation check using it could reach that
      # organization's repository. tests/test_owner_placeholder.py checks this too.
      - name: No old owner placeholder
        run: |
          if git grep -n -I -w -e '[O]WNER'; then
            echo "::error::Use the unregistrable owner placeholder (see Publishing your copy in docs/USAGE.md), not the bare word above."
            exit 1
          fi
      # Lints every workflow (actionlint 1.7.12, with shellcheck for run scripts),
      # pinned by image digest.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A uv-managed CPython 3.12, like the standalone binaries: it includes Tk, which the
    # runners' system Pythons may lack, and the desktop app's window tests need it.
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra gui
      # The desktop app's window tests run under a virtual display on Linux; the
      # macOS runner has a display. They must not be skipped here.
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Tests
        env:
          BOT_FARM_SILENCE_TRACKER_REQUIRE_DISPLAY: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run pytest -q
          else
            uv run pytest -q
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/bot-farm-silence-tracker" --version
          "$RUNNER_TEMP/clean/bin/bot-farm-silence-tracker" events list
          "$RUNNER_TEMP/clean/bin/bot-farm-silence-tracker" scan --platform fake --n 50 --seed 1 \
            --db "$RUNNER_TEMP/smoke.db" --out "$RUNNER_TEMP/smoke.csv"

  # Builds the standalone executable the same way the release does and smoke-tests it,
  # including an HTTPS request from inside the frozen program.
  binary:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: ./packaging/build_binary.sh bot-farm-silence-tracker
      - run: ./packaging/smoke_test.sh ./dist-bin/bot-farm-silence-tracker
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Desktop app self-test from the command-line binary
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./dist-bin/bot-farm-silence-tracker gui --selftest
          else
            ./dist-bin/bot-farm-silence-tracker gui --selftest
          fi

  # Builds the desktop app the same way the release does (packaging/build_gui.sh) and
  # runs its self-test: the window is built hidden, every screen is rendered with
  # offline sample data, and the program exits 0.
  gui-app:
    name: gui-app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: ./packaging/build_gui.sh bot-farm-silence-tracker-gui
      - name: Self-test
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "./dist-bin/Bot Farm Silence Tracker.app/Contents/MacOS/Bot Farm Silence Tracker" --selftest
            du -sh "dist-bin/Bot Farm Silence Tracker.app"
          else
            ./dist-bin/bot-farm-silence-tracker-gui.exe --selftest
            ls -l dist-bin/bot-farm-silence-tracker-gui.exe
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t bot-farm-silence-tracker .
      - name: Run as the unprivileged user and write to the volume
        run: |
          test "$(docker run --rm --entrypoint id bot-farm-silence-tracker -u)" = "10001"
          docker run --rm bot-farm-silence-tracker --version
          docker run --rm -v bfst-ci:/data bot-farm-silence-tracker scan --platform fake --n 50 --seed 1
          # The scan's database is the default outage event's, under events/<event-id>/.
          docker run --rm -v bfst-ci:/data --entrypoint sh bot-farm-silence-tracker -c \
            'ls /data/.cache/bot-farm-silence-tracker/events/*/bot-farm-silence-tracker.db /data/bot-farm-silence-tracker-run-1.csv'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          shellcheck install.sh scripts/apply_repo_rules.sh packaging/build_binary.sh packaging/build_gui.sh packaging/smoke_test.sh tests/installer/test_install_sh.sh
          shellcheck -x packaging/macos/*.sh packaging/macos/scripts/common.sh packaging/macos/scripts/*-*install

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse install.ps1 and the Windows installer scripts
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1') + (Get-ChildItem packaging/windows/*.ps1).FullName) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors)
            if ($errors) { $file; $errors; exit 1 }
          }

  # Runs install.sh end to end against a fake release served on the runner
  # (tests/installer/fake_release_server.py): latest-tag lookup, checksum, the gh
  # attestation check, a missing version, and the uv fallbacks.
  installer-sh:
    name: installer-sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/installer/test_install_sh.sh

  # The same checks where the only downloader is BusyBox wget (no curl), which reports
  # an HTTP error differently from GNU wget. The installer refuses BusyBox wget unless
  # BOT_FARM_SILENCE_TRACKER_ALLOW_BUSYBOX_WGET=1 is set (it may not validate TLS certificates),
  # so the job opts in, and the suite also checks the refusal.
  installer-sh-busybox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the installer checks in Debian with BusyBox wget only
        run: |
          docker run --rm -e BOT_FARM_SILENCE_TRACKER_ALLOW_BUSYBOX_WGET=1 -v "$PWD:/w:ro" -w /w debian:bookworm-slim sh -c '
            apt-get update -qq && apt-get install -y -qq python3 busybox >/dev/null &&
            ln -s /bin/busybox /usr/bin/wget &&
            ! command -v curl &&
            sh tests/installer/test_install_sh.sh'

  # Runs install.ps1 end to end, the way users run it ("irm ... | iex"), in Windows
  # PowerShell 5.1 and in PowerShell 7, against a fake release served on the runner. A
  # fake gh on PATH writes to stderr, which Windows PowerShell 5.1 turns into errors
  # unless the installer handles it.
  installer-ps1:
    name: installer-ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv.exe stands in for the released program: it exits with 0 for "--version".
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run the installer checks
        run: |
          $PSVersionTable.PSVersion.ToString()
          & ./tests/installer/test_install_ps1.ps1 -FakeProgram (Get-Command uv).Source
          exit $LASTEXITCODE
