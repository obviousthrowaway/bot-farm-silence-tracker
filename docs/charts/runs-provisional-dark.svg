<svg xmlns="http://www.w3.org/2000/svg" width="960" height="648" viewBox="0 0 960 648" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
<title id="t">All runs (provisional): share of accounts that went silent</title>
<desc id="d">Event 2026-10-takedown, cutoff 2026-10-11 00:30 UTC, as of 2026-10-20. Went silent: Run 1, 3.3 days: 287 of 6,398 eligible accounts; Run 2, 3.3 to 4.0 days: 213 of 6,324 eligible accounts; Run 3, 4.0 days: 421 of 12,733 eligible accounts; Runs 1 to 3, distinct accounts, 3.3 to 4.0 days: 698 of 19,868 eligible accounts; Run 4 (partial, in progress), 7.9 days: 103 of 7,179 eligible accounts; All runs pooled, distinct accounts, 3.3 to 7.9 days: 681 of 23,745 eligible accounts. Ordinary weeks: 4.20% at 3 days and 0.86% at 7 days. Each row is scored as of its run&#39;s stored data horizon. Runs overlap, so rows are never summed; the distinct-account rows count each account once, on its longest scored window. Run 4 is partial, still being scanned, and not a random subsample of its draw. The pooled row mixes windows and compares with neither base rate. The grey band on each ordinary-weeks row is the range of the three weekly rates. Hollow markers and short bars are a rough matched base rate, interpolated for each window. There is no verdict. Counts only; silence alone is not proof that an account is a bot.</desc>
<rect width="960" height="648" rx="8" fill="#1a1a19"/>
<text x="24.0" y="34.0" font-size="20" fill="#ffffff" font-weight="bold">All runs (provisional): share of accounts that went silent</text>
<text x="24.0" y="56.0" font-size="13" fill="#c3c2b7">Event 2026-10-takedown, cutoff 2026-10-11 00:30 UTC, as of 2026-10-20. Dots are rates with 95% Wilson intervals.</text>
<text x="24.0" y="76.0" font-size="13" fill="#c3c2b7">Each row is scored as of its run&#39;s stored data horizon. Hollow marker or short bar: rough matched base.</text>
<text x="24.0" y="96.0" font-size="13" fill="#c3c2b7">Runs overlap: rows are never summed. Run 4 is partial, still running, not a random draw; its figures will change.</text>
<text x="24.0" y="116.0" font-size="13" fill="#c3c2b7">No verdict. Pooled row mixes windows. Silence alone is not proof of a bot.</text>
<text x="24.0" y="136.0" font-size="13" fill="#c3c2b7">Grey band: range of the three weekly rates (3-day row: 3.87% to 4.61%).</text>
