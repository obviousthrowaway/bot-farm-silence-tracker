<svg xmlns="http://www.w3.org/2000/svg" width="960" height="674" viewBox="0 0 960 674" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
<title id="t">All runs (provisional): share of accounts that went silent</title>
<desc id="d">Event 2026-10-takedown, cutoff 2026-10-11 00:30 UTC, as of 2026-10-22. Reddit archive, went silent: Run 1, 3.3 days: 287 of 6,398 eligible accounts; Run 2, 3.3 to 4.0 days: 213 of 6,324 eligible accounts; Run 3, 4.0 days: 421 of 12,733 eligible accounts; Runs 1 to 3, distinct accounts, 3.3 to 4.0 days: 698 of 19,868 eligible accounts; Run 4 (22,083 of 30,000 scored), 7.9 days: 191 of 13,838 eligible accounts; All runs pooled, distinct accounts, 3.3 to 7.9 days: 669 of 27,674 eligible accounts. Reddit archive, ordinary weeks: 4.20% at 3 days and 0.86% at 7 days. These ordinary-week rows were counted with another definition than the runs (48 h window, no markers), so they are a reference only and not a matched comparison. Each row is scored as of its run&#39;s stored data horizon. Each platform is its own group and rates are never pooled across platforms, because they sample different populations with different base rates. Runs overlap, so rows are never summed; the distinct-account rows count each account once, on its longest scored window. A partial row covers only part of its draw, scored in the order the accounts were fetched, so it is not a random subsample of the draw. A row that mixes windows compares with neither base rate. The grey band on each ordinary-weeks row is the range of the weekly rates. Hollow markers and short bars are a matched base rate: on a row that gives its own, it was measured under the runs&#39; own definition; otherwise it is a rough interpolation for each window from the same platform&#39;s base rates. There is no verdict. Counts only; silence alone is not proof that an account is a bot.</desc>
<rect width="960" height="674" rx="8" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="20" fill="#0b0b0b" font-weight="bold">All runs (provisional): share of accounts that went silent</text>
<text x="24.0" y="56.0" font-size="13" fill="#52514e">Event 2026-10-takedown, cutoff 2026-10-11 00:30 UTC, as of 2026-10-22. Dots are rates with 95% Wilson intervals.</text>
<text x="24.0" y="76.0" font-size="13" fill="#52514e">Each row is scored as of its run&#39;s stored data horizon. Hollow marker or short bar: matched base, same definition as the runs.</text>
<text x="24.0" y="96.0" font-size="13" fill="#52514e">Runs overlap: rows are never summed. Partial rows cover part of a draw, scored in fetch order, so they are not a random subsample.</text>
<text x="24.0" y="116.0" font-size="13" fill="#52514e">No verdict. Platforms are never pooled. Pooled rows mix windows. Silence alone is not proof of a bot.</text>
<text x="24.0" y="136.0" font-size="13" fill="#52514e">Grey band: range of the weekly rates (Reddit archive 3-day row: 3.87% to 4.61%).</text>
