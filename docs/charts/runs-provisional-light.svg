<text x="24.0" y="56.0" font-size="13" fill="#52514e">Event 2026-10-takedown, as of 2026-10-17 14:42 UTC. Dots are rates with 95% Wilson intervals.</text>
<text x="24.0" y="76.0" font-size="13" fill="#52514e">Each row is scored as of its run&#39;s stored data horizon. Hollow marker: rough matched base for its windows (bar: lowest to highest).</text>
<text x="24.0" y="96.0" font-size="13" fill="#52514e">Windows differ from the base rates&#39; 3 and 7 days, so no verdict. Silence alone is not proof of a bot.</text>
<text x="24.0" y="116.0" font-size="13" fill="#52514e">Runs overlap: rows are never summed. Run 3 is partial, not a random draw. Run 1&#39;s top cluster: adj p=0.0115 (cut-off 0.01).</text>
