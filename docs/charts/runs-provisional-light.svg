<svg xmlns="http://www.w3.org/2000/svg" width="960" height="592" viewBox="0 0 960 592" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
<title id="t">Runs 1 to 3 (provisional): share of accounts that went silent</title>
<desc id="d">Event 2026-10-takedown, as of 2026-10-17 14:42 UTC. Went silent: run 1: 288 of 6,399 eligible accounts; run 2: 214 of 6,324 eligible accounts; run 3: 182 of 5,943 eligible accounts; all distinct accounts: 550 of 15,002; run 3 accounts not in runs 1 or 2: 123 of 3,879. Runs overlap, so rows are never summed. Compared with ordinary weeks, but the silence windows differ, so there is no verdict yet. The grey band on each ordinary-weeks row is the range of the three weekly rates. Hollow markers are a rough matched base rate, interpolated for each window. Run 3 is partial and not a random draw. Run 1&#39;s top cluster has adjusted p=0.0115, just above 0.01. Counts only; silence alone is not proof that an account is a bot.</desc>
<rect width="960" height="592" rx="8" fill="#fcfcfb"/>
