# Fixture outage events for the tests. The tests never read the repository's
# events.toml, except the golden test that checks the default event's output.
default = "fixture-main"
legacy_event = "fixture-main"

# The definition the repository's default event (2026-10-takedown) had before its
# strike markers were added: the golden test checks that a custom event with this
# cutoff still reproduces the old output byte for byte.
[[event]]
id = "fixture-main"
name = "Fixture main outage"
cutoff = "2026-10-10T00:00:00Z"
baseline_days = 30
min_silence_days = 3.0
cliff_window_hours = 48.0
notes = "The default event of the tests."

# An event with markers: one exact and one approximate, the earliest 65.6 hours
# before the cutoff, like the repository's default event.
[[event]]
id = "fixture-strikes"
name = "Fixture strikes outage"
cutoff = "2026-10-10T18:30:00Z"
baseline_days = 30
min_silence_days = 3.0
cliff_window_hours = 48.0
marker_margin_hours = 12.0
notes = "An event with two earlier strikes."

[[event.markers]]
id = "first-strike"
name = "First strike"
time = "2026-10-08T00:56:00Z"
approximate = false
time_note = "Reported time of first statements."
notes = "The first fixture strike."
sources = ["Agency A"]

[[event.markers]]
id = "second-strike"
name = "Second strike"
time = "2026-10-08T18:00:00Z"
approximate = true
time_note = "Early morning; exact time unknown."
notes = "The second fixture strike."
sources = ["Agency B", "Agency C"]

[[event]]
id = "fixture-second"
name = "Fixture second outage"
cutoff = "2026-10-12T00:00:00Z"
baseline_days = 14
min_silence_days = 1.0
cliff_window_hours = 24.0
notes = "A second event with its own windows."
